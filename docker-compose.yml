services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iran_stock_intelligence
      POSTGRES_USER: isi
      POSTGRES_PASSWORD: isi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isi -d iran_stock_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    ports:
      - "${HOST_API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  codal-archive:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      CODAL_SYMBOLS: ${CODAL_SYMBOLS:-ساروم}
      CODAL_POLL_INTERVAL_SECONDS: ${CODAL_POLL_INTERVAL_SECONDS:-3600}
      CODAL_INCREMENTAL_PAGES: ${CODAL_INCREMENTAL_PAGES:-3}
      CODAL_PAGE_SIZE: ${CODAL_PAGE_SIZE:-100}
      RAW_DATA_DIR: /app/data/raw
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "app.jobs.codal_archive", "--loop"]
    restart: unless-stopped

volumes:
  postgres_data:
